name: Build Jarvis Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned Node.js 24 mobile runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION="24.21.0-0"
          BASE="https://github.com/fogtape/nodejs-mobile/releases/download/v${VERSION}"
          curl -fL "${BASE}/nodejs-mobile-android-${VERSION}.zip" -o /tmp/nodejs-mobile.zip
          sha256sum /tmp/nodejs-mobile.zip
          mkdir -p /tmp/nodejs-mobile
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          LIB="$(find /tmp/nodejs-mobile -path '*/bin/arm64-v8a/libnode.so' -print -quit)"
          HEADER="$(find /tmp/nodejs-mobile -path '*/include/node/node.h' -print -quit)"
          test -n "${LIB}" && test -n "${HEADER}"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/libnode/include
          LIB_DIR="$(dirname "${LIB}")"
          cp "${LIB_DIR}"/*.so app/src/main/jniLibs/arm64-v8a/
          find "${LIB_DIR}" -maxdepth 1 -name "*.so" -printf "%f\n"
          INCLUDE_ROOT="$(dirname "$(dirname "${HEADER}")")"
          cp -a "${INCLUDE_ROOT}/." app/libnode/include/
      - name: Build and bundle FreeLLMAPI for Android
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/tashfeenahmed/freellmapi.git /tmp/freellmapi
          git -C /tmp/freellmapi checkout 369c47128edf92d30abb59d7b7c0e46c43e1ce57
          cd /tmp/freellmapi
          npm ci --no-audit --no-fund
          npm run build -w client
          python - <<'PY'
          from pathlib import Path
          path = Path("server/src/routes/auth.ts")
          source = path.read_text()
          old = "if (!isLoopbackRemote(req) && !setupCodeMatches((req.body ?? {}).setupCode)) {"
          new = """const embeddedSetupToken = process.env.JARVIS_EMBEDDED_SETUP_TOKEN;
            const suppliedEmbeddedToken = req.headers['x-jarvis-embedded-setup'];
            const embeddedSetupAllowed = !!embeddedSetupToken && suppliedEmbeddedToken === embeddedSetupToken;
            const setupDenied = embeddedSetupToken
              ? !embeddedSetupAllowed
              : (!isLoopbackRemote(req) && !setupCodeMatches((req.body ?? {}).setupCode));
            if (setupDenied) {"""
          if old not in source:
              raise SystemExit("FreeLLMAPI auth setup patch target was not found; refusing an unprotected embedded build.")
          path.write_text(source.replace(old, new, 1))
          PY
          mkdir -p "${GITHUB_WORKSPACE}/app/src/main/assets/freellmapi/client"
          npx esbuild server/src/index.ts --bundle --platform=node --format=esm --target=node24 --external:better-sqlite3 --external:sharp --outfile="${GITHUB_WORKSPACE}/app/src/main/assets/freellmapi/server.mjs" --banner:js='import { createRequire as __createRequire } from "node:module"; const require = __createRequire(import.meta.url);'
          cp -a client/dist "${GITHUB_WORKSPACE}/app/src/main/assets/freellmapi/client/dist"
          cp LICENSE "${GITHUB_WORKSPACE}/app/src/main/assets/freellmapi/FREELLMAPI_LICENSE.txt"
          if [ -f /tmp/nodejs-mobile/LICENSE ]; then cp /tmp/nodejs-mobile/LICENSE "${GITHUB_WORKSPACE}/app/src/main/assets/freellmapi/NODE_RUNTIME_LICENSE.txt"; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build and test Jarvis APK
        run: gradle --no-daemon assembleDebug testDebugUnitTest
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
